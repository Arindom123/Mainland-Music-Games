<!DOCTYPE html>
<html>

<head>
    <!--call .css, tab title-->
    <link href="style.css" rel="stylesheet">
    <title>Mainland Music Games</title>
</head>

<body>

    <header> <!--constant home button-->
        <img id="home-logo" src="assets/marimba.png" alt="Mainland Music Logo">
    </header>

<div class="home" id="home"> <!--home div-->
    <main>
        <div class="home-titles">
            <h1>Mainland Music Games</h1>
            <h2>Percussion Family</h2>
        </div>
        <div class="instruments" id="instruments">
            <button class="instruments" id = "marimba" type="button">Marimba</button>
            <button class="instruments" id = "xylophone" type="button">Xylophone</button>
            <button class="instruments" id = "vibraphone" type="button">Vibraphone</button>
            <button class="instruments" id = "bells" type="button">Bells</button>
        </div>
    </main>
    <footer>
        <p>By: Arindom Paul<br>Mainland Tri-M</p>
        <a
            href = "https://github.com/Arindom123" target = "_blank">
            <img id = "github" src="assets/github-cat-black.png" alt="Check out my work!">
        </a>
    </footer>
</div> <!--home div-->
    
<div class="scaleSelection" id="scaleSelection">
    <h1>Scales</h1>
    <label for="roots">Root:</label>
    <select name="root" id="root">
        <option value="A">A</option>
        <option value="Bb">A#/B♭</option>
        <option value="B">B</option>
        <option value="C">C</option>
        <option value="Db">C#/D♭</option>
        <option value="D">D</option>
        <option value="Eb">D#/E♭</option>
        <option value="E">E</option>
        <option value="F">F</option>
        <option value="Gb">F#/G♭</option>
        <option value="G">G</option>
        <option value="Ab">G#/A♭</option>
    </select>
    <label for="octaves">Octave(s):</label>
    <select name="octaves" id="octaves">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
    </select>
    <div class="scales" id = "scales">
        <div class="wrapper" id = "majorWrapper">
            <h1>Major</h1>
            <div id = "majorButtons">
            <button id = "majorIonian" data-pattern="majorIonian" type="button">ionian</button>
            <button id = "majorLydian" data-pattern="majorLydian" type="button">lydian</button>
            <button id = "majorMixolydian" data-pattern="majorMixolydian" type="button">mixolydian</button>
            <button id = "majorHarmonic" data-pattern="majorHarmonic" type="button">harmonic</button>
            <button id = "majorPentatonic" data-pattern="majorPentatonic" type="button">pentatonic</button>
            <button id = "majorBlues" data-pattern="majorBlues" type="button">blues</button>
            </div>
        </div>
        <div class="wrapper" id = "minorWrapper">
            <h1>Minor</h1>
            <div id = "minorButtons">
            <button id = "minorAeolian" data-pattern="minorAeolian" type="button">aeolian</button>
            <button id = "minorDorian" data-pattern="minorDorian" type="button">dorian</button>
            <button id = "minorPhrygian" data-pattern="minorPhrygian" type="button">phrygian</button>
            <button id = "minorMelodic" data-pattern="minorMelodic" type="button">melodic</button>
            <button id = "minorHarmonic" data-pattern="minorHarmonic" type="button">harmonic</button>
            <button id = "minorPentatonic" data-pattern="minorPentatonic" type="button">pentatonic</button>
            <button id = "minorBlues" data-pattern="minorBlues" type="button">blues</button>
            </div>
        </div>
        <div class="wrapper" id = "otherWrapper">
            <h1>Other</h1>
            <div id = "otherButtons">
            <button id = "chromatic" data-pattern="chromatic" type="button">chromatic</button>
            <button id = "locrian" data-pattern="locrian" type="button">locrian</button>
            </div>
        </div>
    </div>
    <input type="checkbox" id="preview" name="preview">
    <label for="preview">Preview Scale</label>
    <h1 id = "selectScale">Please select a scale</h1>
    <button id = "startButton" type ="button">Start</button>
</div>
<div class="playing" id="playing">

    <button id = "backButton" type ="button">Back</button>
    <h1 id = "scaleName">Current Scale: </h1>
    <button id = "replayButton" type ="button">Replay</button>
</div>
<div class="rungs" id="naturalRungs"></div> 
<div class="rungs" id="accidentalRungs"></div>
<script src="script.js"></script> <!--call .js-->
</body>
</html>
